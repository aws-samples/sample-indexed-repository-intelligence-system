[build-system]
# setuptools ≥ 61 understands PEP 621 metadata directly from pyproject.toml
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "1.1.1"
description = "Codebase understanding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }

# --- REQUIRED runtime dependencies ---
dependencies = [
  "PyYAML",
  "pathspec",
  "rich",
  "chardet",
  "boto3>=1.40.11",
  "click",
  "streamlit",
  "mcp[cli]>=1.13.0",
  "strands-agents>=1.26.0",
  "strands-agents-tools>=0.2.20",
  "prompt-toolkit",
  "tqdm>=4.67.1",
  "fastapi>=0.121.0",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.24.0",
  "websockets>=12.0",
  "pydantic>=2.0.0",
  "bedrock-agentcore>=1.18.1",
  "PyJWT[crypto]>=2.13.0",
  "requests>=2.31.0",
  "aws-cdk-lib>=2.100.0",
  "aws-cdk.aws-bedrock-agentcore-alpha==2.248.0a0",
  "constructs>=10.0.0",
  # cdk-nag v3 removed the NagSuppressions API in favour of CDK's native
  # Validations.of().acknowledge(). infra/stack.py still uses the v2 API, so
  # stay on the 2.x line until that migration is done separately.
  "cdk-nag>=2.27.0,<3",
  "PyYAML>=6.0",
  "urllib3>=2.7.0",
  "tiktoken>=0.5.0",
  "ddgs>=9.10.0",
  "pillow>=11.3.1",
  "python-pptx>=1.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.11.0",
  "cryptography>=50.0.0",
  "python-multipart>=0.0.30",
  "lxml>=6.1.0",
  "gitpython>=3.1.58",
  "tornado>=6.5.7",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[project.scripts]
iris = "iris.cli:cli"
iris_mcp = "iris_mcp.mcp_server:main"

# -------------------------------------------------------------------
# setuptools‑specific configuration
# -------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "scripts*", "infra*", "frontend*", "backend*", "streamlit*"]

[tool.setuptools.package-data]
iris = ["pkg_config_template.yaml", "prompts/*.txt"]


# -------------------------------------------------------------------
# uv‑specific overrides for transitive dependency vulnerabilities
# -------------------------------------------------------------------
[tool.uv]
# Wait before resolving newly published package versions, to reduce exposure
# to compromised or unstable releases landing in the index.
exclude-newer = "7 days"
# Narrow, per-package exemptions from the global cooling-off window, used only
# when a security fix lands inside it. Pinned to a timestamp just past the
# patched release so newer, un-vetted versions are still held back.
exclude-newer-package = { gitpython = "2026-08-05T00:00:00Z" }
constraint-dependencies = [
  # GHSA-3f7w-8rr8-f37f, GHSA-4gmw-gg2m-w46p, GHSA-9rj7-rf2p-w77r, GHSA-hmq2-w58f-27jc
  "gitpython>=3.1.58",
  "python-multipart>=0.0.30",
  "urllib3>=2.7.0",
  "lxml>=6.1.0",
  # GHSA-g6cj-pr64-35w5
  "cryptography>=50.0.0",
  "pytest>=9.0.3",
  # GHSA-cq5v-8q36-5273, GHSA-mq44-7p77-q5h7, GHSA-mfx4-hv73-q22v
  "aiohttp>=3.14.3",
  # GHSA-6hr6-w5qg-qmwg
  "h2>=4.4.1",
  "soupsieve>=2.8.4",
  "idna>=3.15",
  "pydantic-settings>=2.14.2",
]
