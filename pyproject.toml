[build-system]
# setuptools ≥ 61 understands PEP 621 metadata directly from pyproject.toml
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.1.0"
description = "Codebase understanding and editing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }

# --- REQUIRED runtime dependencies ---
dependencies = [
  "PyYAML",
  "pathspec",
  "rich",
  "chardet",
  "boto3>=1.40.11",
  "click",
  "streamlit",
  "mcp[cli]>=1.13.0",
  "strands-agents>=1.26.0",
  "strands-agents-tools>=0.2.20",
  "prompt-toolkit",
  "pytest>=9.0.3",
  "tqdm>=4.67.1",
  "fastapi>=0.121.0",
  "starlette>=0.49.0",
  "uvicorn[standard]>=0.24.0",
  "websockets>=12.0",
  "pydantic>=2.0.0",
  "bedrock-agentcore",
  "PyJWT[crypto]>=2.12.0",
  "requests>=2.31.0",
  "aws-cdk-lib>=2.100.0",
  "constructs>=10.0.0",
  "cdk-nag>=2.27.0",
  "PyYAML>=6.0",
  "urllib3>=2.7.0",
  "tiktoken>=0.5.0",
  "ddgs>=9.10.0",
  "pillow>=11.3.1",
  "cryptography>=46.0.7",
  "python-multipart>=0.0.28",
  "lxml>=6.1.0",
  "gitpython>=3.1.50",
  "tornado>=6.5.5",
]

[project.scripts]
iris = "iris.cli:cli"
iris_mcp = "iris_mcp.mcp_server:main"

# -------------------------------------------------------------------
# setuptools‑specific configuration
# -------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "scripts*", "infra*", "frontend*", "backend*", "streamlit*"]

[tool.setuptools.package-data]
iris = ["pkg_config_template.yaml", "prompts/*.txt"]


# -------------------------------------------------------------------
# uv‑specific overrides for transitive dependency vulnerabilities
# -------------------------------------------------------------------
[tool.uv]
constraint-dependencies = [
  "gitpython>=3.1.50",
  "python-multipart>=0.0.28",
  "urllib3>=2.7.0",
  "lxml>=6.1.0",
  "cryptography>=46.0.7",
  "pytest>=9.0.3",
]
