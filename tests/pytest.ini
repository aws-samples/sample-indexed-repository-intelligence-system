[pytest]
testpaths = tests/unit tests/integration tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv node_modules infra/cdk.out __pycache__ .pytest_cache
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring AWS
    unit: marks tests as unit tests (no external dependencies)
    asyncio: marks tests as async tests
    aws: marks tests that require AWS credentials and services
