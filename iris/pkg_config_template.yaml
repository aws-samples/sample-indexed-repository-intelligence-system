  - "*.so"
  - ".Python"
  - ".installed.cfg"
  - ".env/"
  - .venv/
  - .venv_dev/
  - env/
  - venv/
  - venv_dev/
  - ENV/
  - ".coverage"
  - ".DS_Store"
  - ".git/"
  - ".gitlab/"
  - ".github/"
  - ".idea/"
