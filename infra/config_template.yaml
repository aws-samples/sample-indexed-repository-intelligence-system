# CDK stack name for the deployment
app_name: "IrisStandalone"

# AgentCore Runtime name (unique per account+region; letters/digits/underscores
# only, no hyphens; must start with a letter; max 48 chars). Managed by deploy.sh
# option 4, which proposes a name derived from app_name, lets you confirm/change
# it, and checks availability before deploying. Leave empty to derive it from
# app_name at synth time.
runtime_name: ""

# S3 bucket configuration for codebase artifacts
# Note: The CDK stack enforces the following on all infrastructure S3 buckets:
#   - Block Public Access: BLOCK_ALL (prevents accidental public exposure)
#   - Encryption at rest: SSE-S3 enabled by default
#   - Versioning: Enabled
#   - TLS/HTTPS: Enforced (enforce_ssl=True)
#   - Access logging: Enabled to ServerAccessLogsBucket
# The kms_key_arn below is only for specifying a customer managed AWS KMS key for additional control.
codebase_artifacts:
  bucket: "<placeholder>" # S3 bucket name containing codebase data (leave empty to disable S3 mode)
  prefix: "" # Optional S3 prefix/key (leave empty if not needed)
  kms_key_arn: "" # Optional: Customer managed AWS KMS key ARN. SSE-S3 encryption is always enabled; set this to use SSE-KMS instead.
